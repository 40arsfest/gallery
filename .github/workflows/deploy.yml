name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build CSS
        run: |
          npm ci
          npm run build:css

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure appsettings
        env:
          GALLERY_DATA_BASE_URL: ${{ vars.GALLERY_DATA_BASE_URL }}
        run: |
          if [ -z "$GALLERY_DATA_BASE_URL" ]; then
            echo "GALLERY_DATA_BASE_URL repository variable is not set."
            exit 1
          fi
          cat > wwwroot/appsettings.json <<EOF
          {
            "Gallery": {
              "DataBaseUrl": "$GALLERY_DATA_BASE_URL"
            }
          }
          EOF

      - name: Publish Blazor app
        run: dotnet publish -c Release -p:BaseHref=/gallery/

      - name: Set base href for GitHub Pages
        run: |
          INDEX=./bin/Release/net10.0/publish/wwwroot/index.html
          sed -i 's|<base href="/" />|<base href="/gallery/" />|g' "$INDEX"
          grep 'base href' "$INDEX"

      - name: Add GitHub Pages files
        run: |
          touch ./bin/Release/net10.0/publish/wwwroot/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./bin/Release/net10.0/publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
